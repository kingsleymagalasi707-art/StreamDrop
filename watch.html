<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Watch • Veyra</title>
<link rel="stylesheet" href="style.css">
<style>
.watch-page{max-width:1180px;margin:0 auto;padding:24px 20px 80px}.watch-layout{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:24px}.watch-main{min-width:0}.watch-video-wrap{background:#000;border-radius:18px;overflow:hidden;box-shadow:var(--shadow)}#watchPlayer,#watchEmbed{display:block;width:100%;aspect-ratio:16/9;background:#000;border:0}.watch-title{font-size:clamp(22px,3vw,34px);line-height:1.18;margin:18px 0 9px;letter-spacing:-.035em}.watch-meta{display:flex;justify-content:space-between;gap:16px;align-items:center;color:var(--muted);font-size:13px;padding-bottom:18px;border-bottom:1px solid var(--line)}.watch-actions{display:flex;gap:9px;flex-wrap:wrap;margin:16px 0}.watch-action{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:11px;padding:10px 13px;font:700 12px Inter;cursor:pointer}.watch-action.primary{background:var(--accent);color:#fff;border-color:var(--accent)}.quality-panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;margin-top:18px}.quality-panel-head{display:flex;justify-content:space-between;gap:12px;align-items:start}.quality-panel h3{margin:0;font-size:16px}.quality-panel p{margin:4px 0 0;color:var(--muted);font-size:11px}.quality-options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:14px}.quality-option{position:relative;text-align:left;border:1px solid var(--line);background:var(--soft);color:var(--text);border-radius:12px;padding:12px;cursor:pointer}.quality-option.active{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 12%,transparent)}.quality-option strong{display:block;font-size:13px}.quality-option span{display:block;color:var(--muted);font-size:10px;margin-top:4px}.quality-recommended{position:absolute;right:8px;top:7px;color:var(--accent);font-size:8px;font-weight:900;text-transform:uppercase}.watch-download{width:100%;margin-top:12px;height:48px;border:0;border-radius:12px;background:var(--accent);color:#fff;font:800 13px Inter;cursor:pointer}.related-panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px;position:sticky;top:92px}.related-panel h2{font-size:16px;margin:3px 4px 12px}.related-list{display:grid;gap:11px}.related-card{display:grid;grid-template-columns:118px 1fr;gap:10px;cursor:pointer;padding:5px;border-radius:10px}.related-card:hover{background:var(--soft)}.related-card img,.related-thumb{width:118px;height:68px;object-fit:cover;border-radius:8px;background:var(--soft)}.related-card strong{font-size:11px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.related-card small{display:block;color:var(--muted);font-size:9px;margin-top:4px}.watch-loading,.watch-error{padding:50px 20px;text-align:center;color:var(--muted)}.watch-error strong{display:block;color:var(--text);margin-bottom:7px}.watch-back{display:inline-flex;gap:7px;align-items:center;margin-bottom:15px;color:var(--muted);font-size:12px;font-weight:700}.watch-back:hover{color:var(--text)}
@media(max-width:850px){.watch-layout{grid-template-columns:1fr}.related-panel{position:static}.watch-page{padding-bottom:90px}}@media(max-width:560px){.watch-page{padding:12px 12px 90px}.watch-video-wrap{border-radius:12px}.watch-title{font-size:21px}.watch-meta{display:block}.watch-actions{display:grid;grid-template-columns:1fr 1fr}.watch-actions .primary{grid-column:1/-1}.quality-options{grid-template-columns:1fr 1fr}.related-card{grid-template-columns:110px 1fr}.related-card img,.related-thumb{width:110px;height:64px}}
</style>
</head>
<body>
<header class="topbar"><a class="brand" href="/"><span class="brand-mark">V</span><span>Vey<span>ra</span></span></a><nav><a href="/">Home</a><a href="/#downloads">Downloads</a><a href="/#history">History</a></nav><button class="ghost" id="watchTheme" aria-label="Toggle theme">◐</button></header>
<main class="watch-page">
<a class="watch-back" href="/">← Back to Veyra</a>
<div id="watchLoading" class="watch-loading">Preparing video…</div>
<div id="watchError" class="watch-error" hidden><strong>Video could not be prepared.</strong><span id="watchErrorText"></span><br><br><a href="/">Return to Veyra</a></div>
<div id="watchContent" class="watch-layout" hidden>
<section class="watch-main">
<div class="watch-video-wrap"><video id="watchPlayer" controls playsinline preload="metadata"></video><iframe id="watchEmbed" hidden title="YouTube video" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe></div>
<h1 class="watch-title" id="watchTitle">Video</h1>
<div class="watch-meta"><span id="watchMeta">Preparing…</span><span id="watchSource">Veyra</span></div>
<div class="watch-actions"><button class="watch-action primary" id="watchPlayBtn">▶ Play</button><button class="watch-action" id="watchOpenBtn">Open source ↗</button><button class="watch-action" id="watchShareBtn">Share</button></div>
<div class="quality-panel"><div class="quality-panel-head"><div><h3>Download quality</h3><p>Choose the resolution available from the source.</p></div><span id="watchSelectedQuality">Best available</span></div><div class="quality-options" id="watchQualities"></div><button class="watch-download" id="watchDownloadBtn">Download selected quality ↓</button></div>
</section>
<aside class="related-panel"><h2>More videos</h2><div class="related-list" id="relatedList"><div class="watch-loading">Loading recommendations…</div></div></aside>
</div>
</main>
<nav class="mobile-bottom-nav" aria-label="Mobile navigation"><a href="/"><span>⌂</span><small>Home</small></a><a href="/#download"><span>⌕</span><small>Search</small></a><a href="/#downloads"><span>↓</span><small>Downloads</small></a><a href="/#history"><span>◷</span><small>History</small></a></nav>
<script>
const $=s=>document.querySelector(s);const params=new URLSearchParams(location.search);const sourceUrl=params.get('url')||'';const seed=params.get('q')||'';let selectedQuality='Original';let videoData=null;
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function setTheme(){document.body.classList.toggle('dark',localStorage.getItem('veyra-dark')==='true')}setTheme();$('#watchTheme').onclick=()=>{document.body.classList.toggle('dark');localStorage.setItem('veyra-dark',document.body.classList.contains('dark'))};
function showError(e){$('#watchLoading').hidden=true;$('#watchContent').hidden=true;$('#watchError').hidden=false;$('#watchErrorText').textContent=e?.message||'Try another video.'}
async function load(){if(!sourceUrl){showError(new Error('No video URL was provided.'));return}try{const r=await fetch('/api/analyze',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url:sourceUrl})});const d=await r.json();if(!r.ok||!d.supported)throw new Error(d.error||'This video is not supported.');videoData=d;$('#watchLoading').hidden=true;$('#watchContent').hidden=false;$('#watchTitle').textContent=d.title||'Video';$('#watchMeta').textContent=[d.uploader,d.duration?formatDuration(d.duration):null,d.provider].filter(Boolean).join(' • ')||'Video';$('#watchSource').textContent=d.provider||'Video source';if(d.thumbnail)$('#watchPlayer').poster=d.thumbnail;const qs=d.qualities?.length?d.qualities:['Original'];selectedQuality=qs[0];$('#watchSelectedQuality').textContent=selectedQuality;$('#watchQualities').innerHTML=qs.map((q,i)=>`<button class="quality-option ${i===0?'active':''}" data-quality="${esc(q)}"><strong>${esc(q)}</strong><span>${q==='Original'?'Source quality':'Video resolution'}${i===0?' • Recommended':''}</span>${i===0?'<b class="quality-recommended">Recommended</b>':''}</button>`).join('');
if(d.embedUrl){$('#watchPlayer').hidden=true;$('#watchEmbed').hidden=false;$('#watchEmbed').src=d.embedUrl+'&autoplay=1&mute=1&playsinline=1';}
else {$('#watchEmbed').hidden=true;$('#watchPlayer').hidden=false;$('#watchPlayer').src=`/api/stream?url=${encodeURIComponent(d.url||sourceUrl)}&quality=${encodeURIComponent(selectedQuality)}`;}
if(d.downloadAvailable===false){$('#watchDownloadBtn').disabled=true;$('#watchDownloadBtn').textContent='Download unavailable'; if(d.embedUrl){const open=$('#watchOpenBtn'); if(open) open.textContent='Watch on YouTube ↗';}}
loadRelated(d.title||seed||'popular videos')}catch(e){showError(e)}}
function formatDuration(n){n=Number(n)||0;const h=Math.floor(n/3600),m=Math.floor((n%3600)/60),s=Math.floor(n%60);return h?`${h}h ${m}m`:m?`${m}m ${s}s`:`${s}s`}
$('#watchQualities').addEventListener('click',e=>{const b=e.target.closest('[data-quality]');if(!b)return;document.querySelectorAll('.quality-option').forEach(x=>x.classList.remove('active'));b.classList.add('active');selectedQuality=b.dataset.quality;$('#watchSelectedQuality').textContent=selectedQuality;if(videoData && !videoData.embedUrl){$('#watchPlayer').src=`/api/stream?url=${encodeURIComponent(videoData.url||sourceUrl)}&quality=${encodeURIComponent(selectedQuality)}`;$('#watchPlayer').load()}});
$('#watchPlayBtn').onclick=async()=>{if(videoData?.embedUrl){$('#watchEmbed').src=videoData.embedUrl+'&autoplay=1&mute=1&playsinline=1';return}try{await $('#watchPlayer').play()}catch(_){$('#watchPlayer').focus()}};$('#watchOpenBtn').onclick=()=>window.open(sourceUrl,'_blank','noopener,noreferrer');$('#watchShareBtn').onclick=async()=>{const u=location.href;try{await navigator.clipboard.writeText(u);$('#watchShareBtn').textContent='Link copied ✓'}catch(_){prompt('Copy this watch link:',u)}};$('#watchDownloadBtn').onclick=async()=>{if(!videoData || videoData.downloadAvailable===false)return;const b=$('#watchDownloadBtn');b.disabled=true;b.textContent='Preparing download…';try{const r=await fetch('/api/download/start',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url:videoData.url||sourceUrl,quality:selectedQuality,format:'mp4'})});const d=await r.json();if(!r.ok)throw new Error(d.error||'Unable to start download.');let tries=0;const poll=async()=>{const sr=await fetch('/api/download/'+encodeURIComponent(d.jobId)+'/status',{cache:'no-store'});const st=await sr.json();if(st.status==='complete'){const a=document.createElement('a');a.href='/api/download/'+encodeURIComponent(d.jobId)+'/file';a.download='';document.body.appendChild(a);a.click();a.remove();b.disabled=false;b.textContent='Download complete ✓';return}if(st.status==='error'||st.status==='canceled')throw new Error(st.error||'Download failed.');if(++tries>120)throw new Error('Download took too long. Check the Downloads section.');setTimeout(poll,500)};await poll()}catch(e){b.disabled=false;b.textContent='Download selected quality ↓';alert(e.message||'Download failed.')}};
async function loadRelated(q){try{const r=await fetch('/api/recommendations?seed='+encodeURIComponent(q)+'&limit=8');const d=await r.json();const list=d.videos||[];if(!list.length){$('#relatedList').innerHTML='<div class="watch-loading">No recommendations right now.</div>';return}$('#relatedList').innerHTML=list.map(v=>`<a class="related-card" href="/watch?url=${encodeURIComponent(v.url)}"><img src="${esc(v.thumbnail||'')}" alt="" loading="lazy" referrerpolicy="no-referrer"><div><strong>${esc(v.title)}</strong><small>${esc(v.channel||v.platform||'Video')}</small></div></a>`).join('')}catch(_){$('#relatedList').innerHTML='<div class="watch-loading">Recommendations unavailable.</div>'}}
load();
</script>
</body></html>
